# fly.toml app configuration file generated for code-my-spec-prod on 2025-10-06T22:44:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'code-my-spec-prod'
primary_region = 'yyz'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'code-my-spec-prod.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

# The graph rebuild after a sync starves a shared CPU, and local embeddings
# load ~425 MB native, so 1 GB shared took prod down on 2026-10-28.
[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 2
