# Kamal deploys uat for code_my_spec.
service: code_my_spec-uat
image: code-my-spec
<% if ENV["CMS_SSH_KEY_PATH"] %>
ssh:
  keys: ["<%= ENV["CMS_SSH_KEY_PATH"] %>"]
  keys_only: true
  log_level: debug
<% end %>

servers:
  web:
    hosts:
      - uat.codemyspec.com
    options:
      network: db_net

proxy:
  ssl: true
  # Where the app listens (PORT below); kamal-proxy otherwise assumes 80.
  app_port: 4000
  host: uat.codemyspec.com
  # The proxy probes this before moving traffic. It must answer without a
  # session, without auth and without the database (criterion 7977).
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

builder:
  # Kamal requires an arch even though bin/deploy ships a prebuilt image
  # (--skip-push). Must match this environment's host.
  arch: arm64

registry:
  server: 10.1.0.2:5000
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    PORT: 4000
    APP_ENV: uat
    PHX_HOST: uat.codemyspec.com
    # Names this deploy to the project's own telemetry collector, so
    # traces and logs land under the right ServiceName with no manual
    # config on Sam's part (criterion 1713/1855).
    OTEL_SERVICE_NAME: code_my_spec-uat-web
    OTEL_EXPORTER_OTLP_ENDPOINT: http://cms-otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  secret:
    - SOPS_AGE_KEY

# Migrations run against the new image before traffic moves to it, so a
# migration that fails leaves the old version serving.
boot:
  limit: 1
  wait: 2
