name: build

on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        registry: ["10.0.0.2:5000", "10.1.0.2:5000"]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.CMS_REGISTRY_USERNAME }}
          password: ${{ secrets.CMS_REGISTRY_PASSWORD }}

      # Tagged by commit SHA, so what is running is traceable to a commit
      # rather than to whenever `latest` was last pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.registry }}/code-my-spec:${{ github.sha }}
            ${{ matrix.registry }}/code-my-spec:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
