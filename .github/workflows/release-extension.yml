name: Release Extension

on:
  push:
    tags:
      - 'v*'
  # Manual build of the artifacts (tarballs + MSI) for testing, WITHOUT
  # publishing to the marketplace or cutting a release. The publish job is
  # gated to tag pushes only.
  workflow_dispatch:

permissions:
  contents: write

env:
  MIX_ENV: prod_cli
  ELIXIR_VERSION: '1.19.5'
  OTP_VERSION: '27.3.4.10'
  EXTENSION_REPO: Code-My-Spec/plugins

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            asset: cms-darwin-arm64.tar.gz
          - name: Windows x64
            runner: windows-latest
            asset: cms-windows-x64.tar.gz

    # Force bash on Windows runners so curl/tar/cp/`>> "$GITHUB_PATH"` work
    # identically across platforms. Git Bash is preinstalled on windows-latest.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # windows-latest's image reports ImageOS=win25-vs2026, which setup-beam
      # can't map. Pin it to the base label so it resolves the Windows build.
      - name: Pin ImageOS for setup-beam (Windows)
        if: runner.os == 'Windows'
        run: echo "ImageOS=win25" >> "$GITHUB_ENV"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      # Plain `mix release` — a self-contained OTP release (ERTS + start.boot +
      # NIFs on disk), built natively on each runner. No Burrito, no zig, no
      # runtime self-extraction. The tarball is what every packager consumes.
      - name: Build release
        run: |
          rm -rf _build/prod_cli release/
          mix compile --warnings-as-errors
          mix release code_my_spec_cli
          cp _build/prod_cli/code_my_spec_cli-*.tar.gz "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

      # Package the Claude Code extension once (burrito-free, file-shuffle only).
      - name: Package extension
        if: runner.os == 'macOS'
        run: mix cms.package_plugin release/codemyspec-extension

      - name: Upload extension artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: release/codemyspec-extension/
          include-hidden-files: true
          retention-days: 1

      # Windows MSI: WiX harvests the release FOLDER and registers the
      # CodeMySpec service (Shawl wrapping the release launcher). WiX only
      # validates on Windows; pinned to v5 (v6/v7 are Windows-locked + gate on
      # the OSMF EULA). continue-on-error: the folder-harvest MSI is the one
      # piece not validated on a real install — it must not block the tarball
      # release (Mac/brew is proven, Windows tarball still publishes).
      - name: Build Windows MSI (WiX v5)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          # Read from mix.exs (robust for both tag pushes and workflow_dispatch,
          # where GITHUB_REF is a branch and would inject slashes into sed).
          VERSION=$(grep -m1 'version:' mix.exs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          REL="$GITHUB_WORKSPACE/_build/prod_cli/rel/code_my_spec_cli"
          # GITHUB_WORKSPACE is D:\a\... on Windows; backslashes in a sed
          # replacement get escape-interpreted (\a -> BEL 0x07) and corrupt the
          # path. Forward slashes are valid in WiX globs and sed-safe.
          REL="${REL//\\//}"
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Shawl lives in the workspace (NOT inside $REL) so the release-tree
          # harvest doesn't pick it up; its own component sources it via -b.
          curl -fsSL -o shawl.zip \
            "https://github.com/mtkennerly/shawl/releases/download/v1.9.0/shawl-v1.9.0-win64.zip"
          unzip -o shawl.zip -d shawl_tmp
          cp "$(find shawl_tmp -name 'shawl.exe' | head -1)" shawl.exe
          sed -e "s/__CMS_VERSION__/${VERSION}/" -e "s|__REL_GLOB__|${REL}/**|" \
            installers/windows/cms.wxs > cms_build.wxs
          # -arch x64 is REQUIRED: WiX defaults to x86, which makes
          # ProgramFiles64Folder resolve to "C:\Program Files (x86)\CodeMySpec".
          # The "(x86)" parens break the Elixir release .bat launcher (an
          # unquoted path expanded inside a cmd `if (...)` block), so the BEAM
          # never boots under the service. x64 installs to "C:\Program Files".
          wix build cms_build.wxs -arch x64 -b . -o cms-setup-x64.msi
          ls -la cms-setup-x64.msi

      - name: Upload MSI artifact
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cms-setup-x64.msi
          path: cms-setup-x64.msi
          retention-days: 1

  publish-extension:
    name: Publish Extension & Release
    needs: build
    # Tag pushes only — a manual workflow_dispatch just builds artifacts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          echo "Artifact structure:"
          find artifacts -type f | head -40

          # Per-OS release tarballs.
          for dir in artifacts/cms-*.tar.gz; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            file=$(find "$dir" -type f -name '*.tar.gz' | head -1)
            [ -n "$file" ] && cp "$file" "release-assets/$name"
          done

          # MSI (if the Windows MSI step succeeded).
          msi=$(find artifacts -name 'cms-setup-x64.msi' -type f | head -1)
          [ -n "$msi" ] && cp "$msi" release-assets/cms-setup-x64.msi

          # Compute + inject the darwin tarball sha256 into the brew formula so
          # `brew install` from the published formula matches the release asset.
          DARWIN="release-assets/cms-darwin-arm64.tar.gz"
          if [ -f "$DARWIN" ]; then
            SHA=$(shasum -a 256 "$DARWIN" | cut -d' ' -f1)
            TAG="${{ steps.version.outputs.tag }}"; VER="${TAG#v}"
            sed -e "s/__CMS_TAG__/${TAG}/g; s/__CMS_VERSION__/${VER}/g; s/__DARWIN_SHA256__/${SHA}/" \
              installers/macos/codemyspec.rb > release-assets/codemyspec.rb
          fi

          ls -la release-assets/

      - name: Fix extension script permissions
        run: |
          chmod +x artifacts/extension/plugins/codemyspec/.claude-plugin/bin/* || true
          [ -f artifacts/extension/install.sh ] && chmod +x artifacts/extension/install.sh || true

      # Publish the filled brew formula to the tap so
      # `brew install Code-My-Spec/tap/codemyspec` resolves this release.
      # continue-on-error: a tap-token hiccup must never block the release
      # (the gh release + marketplace push are what matter most) — but on
      # failure we emit a ::error:: annotation so it can't fail SILENTLY: a
      # swallowed push is exactly how the tap drifted a release behind before.
      #
      # TAP_TOKEN (preferred) must have write to Code-My-Spec/homebrew-tap.
      # Falls back to EXTENSION_REPO_TOKEN, which is scoped to the plugins repo
      # and will 403 against the tap unless homebrew-tap is added to its repos.
      - name: Publish brew formula to tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN || secrets.EXTENSION_REPO_TOKEN }}
        run: |
          if [ ! -f release-assets/codemyspec.rb ]; then
            echo "No formula (no darwin tarball) — skipping tap publish."
            exit 0
          fi
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/Code-My-Spec/homebrew-tap.git" tap-repo; then
            echo "::error::tap publish: cannot clone homebrew-tap — token lacks access. Add homebrew-tap to the PAT's repositories (or set TAP_TOKEN)."
            exit 1
          fi
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          cp ../release-assets/codemyspec.rb Formula/codemyspec.rb
          git add Formula/codemyspec.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged."
            exit 0
          fi
          git commit -m "codemyspec ${{ steps.version.outputs.tag }}"
          if ! git push origin HEAD; then
            echo "::error::tap publish: push to homebrew-tap rejected — token lacks write. Add homebrew-tap to the PAT's repositories (or set TAP_TOKEN)."
            exit 1
          fi
          # Confirm the formula version actually landed on the remote default branch.
          TAG="${{ steps.version.outputs.tag }}"; VER="${TAG#v}"
          git fetch origin
          if git show "origin/HEAD:Formula/codemyspec.rb" | grep -q "version \"${VER}\""; then
            echo "tap publish: homebrew-tap now serves ${TAG}."
          else
            echo "::error::tap publish: push reported success but origin does not show this version."
            exit 1
          fi

      - name: Push files + tag to extension repo
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${EXTENSION_REPO}.git" target-repo
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf plugins/codemyspec
          mkdir -p plugins
          cp -R ../artifacts/extension/plugins/codemyspec plugins/codemyspec

          # Root-level installers we own.
          cp ../artifacts/extension/install.sh install.sh
          cp ../installers/windows/install.ps1 install.ps1
          cp ../artifacts/extension/README.md README.md

          rm -rf .claude-plugin/bin
          rm -f .claude-plugin/plugin.json
          rm -rf agents skills hooks
          rm -f AGENTS.md

          OUR_ENTRY=$(jq '.plugins[] | select(.name == "codemyspec")' \
            ../artifacts/extension/.claude-plugin/marketplace.json)
          mkdir -p .claude-plugin
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --argjson entry "$OUR_ENTRY" '
              .plugins = (
                (.plugins // []) | map(select(.name != "codemyspec")) + [$entry]
              )
            ' .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.new
            mv .claude-plugin/marketplace.json.new .claude-plugin/marketplace.json
          else
            cp ../artifacts/extension/.claude-plugin/marketplace.json .claude-plugin/marketplace.json
          fi

          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Release codemyspec ${{ steps.version.outputs.tag }}"
          fi
          git tag -f "${{ steps.version.outputs.tag }}"
          git push origin main
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Delete existing release on extension repo (if any)
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" \
            --yes --repo "${EXTENSION_REPO}" 2>/dev/null || true

      - name: Create GitHub Release on extension repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.EXTENSION_REPO }}
          token: ${{ secrets.EXTENSION_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            macOS (Homebrew):
            ```bash
            brew install Code-My-Spec/tap/codemyspec
            ```

            Windows: download `cms-setup-x64.msi` and run it.

            Claude Code plugin:
            ```bash
            /plugin marketplace add Code-My-Spec/plugins
            /plugin install codemyspec@codemyspec
            ```
