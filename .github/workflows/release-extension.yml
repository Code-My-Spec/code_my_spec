name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MIX_ENV: prod_cli
  ELIXIR_VERSION: '1.19.5'
  OTP_VERSION: '27.3.4.10'
  EXTENSION_REPO: Code-My-Spec/plugins

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: macos_m1
            binary: cms-darwin-arm64
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Zig 0.15.2
        run: |
          curl -fSL "https://ziglang.org/download/0.15.2/${{ matrix.zig_archive }}" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install xz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Install xz (macOS)
        if: runner.os == 'macOS'
        run: brew install xz || true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Build release
        run: |
          # Wipe the full prod_cli _build tree — `mix compile --force` alone
          # kept shipping stale binaries across v1.4.13, v1.4.15, v1.4.22.
          # Likely cause: cache restore preserves beam mtimes that confuse
          # the compile/assemble chain. Full wipe is boringly reliable and
          # only costs ~60s of extra compile time.
          rm -rf _build/prod_cli release/
          mix compile
          mix release code_my_spec_cli
        env:
          BURRITO_TARGET: ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/binaries/${{ matrix.binary }}
          # Only needed long enough for the release + publish-extension
          # jobs to download. Release assets are stored separately.
          retention-days: 1

      - name: Upload extension artifact
        if: matrix.target == 'macos_m1'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          # PackageExtension rebuilds this dir into the marketplace layout
          # (.claude-plugin/marketplace.json + plugins/codemyspec/...).
          # The raw source CodeMySpec/ is the pre-marketplace flat shape.
          path: release/codemyspec-extension/
          include-hidden-files: true
          retention-days: 1

  publish-extension:
    name: Publish Extension & Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binary release assets
        run: |
          mkdir -p release-assets
          echo "Artifact structure:"
          find artifacts -type f | head -20
          for dir in artifacts/cms-*; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            file=$(find "$dir" -type f | head -1)
            if [ -n "$file" ]; then
              cp "$file" "release-assets/$binary"
              chmod +x "release-assets/$binary"
            fi
          done
          ls -la release-assets/

      - name: Fix extension script permissions
        run: |
          # Marketplace layout: bin scripts live under plugins/codemyspec/.
          chmod +x artifacts/extension/plugins/codemyspec/.claude-plugin/bin/*
          [ -f artifacts/extension/install.sh ] && chmod +x artifacts/extension/install.sh || true

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Push files + tag to extension repo
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          # Clone the existing marketplace repo so we only update our own
          # slice — other plugins (e.g. plugins/market-my-spec/) must not
          # be wiped. Previous approach was git init + force-push, which
          # clobbered everything.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${EXTENSION_REPO}.git" target-repo
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Replace our plugin slice with the freshly packaged one.
          rm -rf plugins/codemyspec
          mkdir -p plugins
          cp -R ../artifacts/extension/plugins/codemyspec plugins/codemyspec

          # Root-level codemyspec assets (install.sh, README) we own.
          cp ../artifacts/extension/install.sh install.sh
          cp ../artifacts/extension/README.md README.md

          # One-time cleanup: codemyspec used to live at the repo root
          # (flat layout, pre-marketplace restructure). Remove leftover
          # codemyspec-specific root paths so they don't double up with
          # the new plugins/codemyspec/ content. Idempotent — rm -f
          # doesn't fail if already gone on subsequent releases.
          rm -rf .claude-plugin/bin
          rm -f .claude-plugin/plugin.json
          rm -rf agents skills hooks
          rm -f AGENTS.md

          # Merge codemyspec into the repo's marketplace.json: replace the
          # codemyspec entry, keep everything else (market-my-spec, etc).
          OUR_ENTRY=$(jq '.plugins[] | select(.name == "codemyspec")' \
            ../artifacts/extension/.claude-plugin/marketplace.json)
          mkdir -p .claude-plugin
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --argjson entry "$OUR_ENTRY" '
              .plugins = (
                (.plugins // []) | map(select(.name != "codemyspec")) + [$entry]
              )
            ' .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.new
            mv .claude-plugin/marketplace.json.new .claude-plugin/marketplace.json
          else
            cp ../artifacts/extension/.claude-plugin/marketplace.json .claude-plugin/marketplace.json
          fi

          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Release codemyspec ${{ steps.version.outputs.tag }}"
          fi
          git tag -f "${{ steps.version.outputs.tag }}"
          git push origin main
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Delete existing release on extension repo (if any)
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" \
            --yes --repo "${EXTENSION_REPO}" 2>/dev/null || true

      - name: Create GitHub Release on extension repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.EXTENSION_REPO }}
          token: ${{ secrets.EXTENSION_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            /plugin marketplace add Code-My-Spec/plugins
            /plugin install codemyspec@codemyspec
            ```

            The CLI binary auto-installs on first SessionStart.
