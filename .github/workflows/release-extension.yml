name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MIX_ENV: prod_cli
  ELIXIR_VERSION: '1.19.5'
  OTP_VERSION: '27'
  EXTENSION_REPO: Code-My-Spec/code_my_spec_claude_code_extension

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: macos_m1
            binary: cms-darwin-arm64
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz
          - name: macOS x64
            runner: macos-latest
            target: macos
            binary: cms-darwin-x64
            zig_archive: zig-x86_64-macos-0.15.2.tar.xz
          - name: Linux x64
            runner: ubuntu-latest
            target: linux
            binary: cms-linux-x64
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz
          - name: Linux ARM64
            runner: ubuntu-latest
            target: linux_aarch64
            binary: cms-linux-arm64
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Zig 0.15.2
        run: |
          curl -fSL "https://ziglang.org/download/0.15.2/${{ matrix.zig_archive }}" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install xz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Install xz (macOS)
        if: runner.os == 'macOS'
        run: brew install xz || true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Build release
        run: |
          rm -rf _build/prod_cli/rel release/
          mix release code_my_spec_cli
        env:
          BURRITO_TARGET: ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/binaries/${{ matrix.binary }}

      - name: Upload extension artifact
        if: matrix.target == 'macos_m1'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: CodeMySpec/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          echo "Artifact structure:"
          find artifacts -type f | head -20
          for dir in artifacts/cms-*; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            # download-artifact v4 may flatten or preserve paths
            file=$(find "$dir" -type f | head -1)
            if [ -n "$file" ]; then
              cp "$file" "release-assets/$binary"
              chmod +x "release-assets/$binary"
            fi
          done
          ls -la release-assets/

      - name: Delete existing release if present
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            ### Plugin Marketplace (recommended)
            ```bash
            /plugin marketplace add Code-My-Spec/code_my_spec_claude_code_extension
            /plugin install codemyspec@codemyspec
            ```

            ### Manual Install
            ```bash
            git clone https://github.com/Code-My-Spec/code_my_spec_claude_code_extension.git
            cd code_my_spec_claude_code_extension
            bash install.sh
            claude plugin install ./
            ```

  publish-extension:
    name: Publish Extension Repo
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: extension

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Push to extension repo
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          cd extension
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${EXTENSION_REPO}.git"
          git add .
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag -f "${{ steps.version.outputs.tag }}"
          git push -f origin main
          git push -f origin "${{ steps.version.outputs.tag }}"
