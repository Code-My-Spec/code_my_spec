name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MIX_ENV: prod_cli
  ELIXIR_VERSION: '1.19.5'
  OTP_VERSION: '27.3.4.10'
  EXTENSION_REPO: Code-My-Spec/code_my_spec_claude_code_extension

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: macos_m1
            binary: cms-darwin-arm64
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz
          - name: macOS x64
            runner: macos-latest
            target: macos
            binary: cms-darwin-x64
            zig_archive: zig-x86_64-macos-0.15.2.tar.xz
          - name: Linux x64
            runner: ubuntu-latest
            target: linux
            binary: cms-linux-x64
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz
          - name: Linux ARM64
            runner: ubuntu-latest
            target: linux_aarch64
            binary: cms-linux-arm64
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Zig 0.15.2
        run: |
          curl -fSL "https://ziglang.org/download/0.15.2/${{ matrix.zig_archive }}" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install xz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Install xz (macOS)
        if: runner.os == 'macOS'
        run: brew install xz || true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Build release
        run: |
          rm -rf _build/prod_cli/rel release/
          # Force app recompile — cache restore can leave stale beams that
          # mix release happily reuses, shipping source fixes that never
          # made it into the binary.
          mix compile --force
          mix release code_my_spec_cli
        env:
          BURRITO_TARGET: ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: release/binaries/${{ matrix.binary }}
          # Only needed long enough for the release + publish-extension
          # jobs to download. Release assets are stored separately.
          retention-days: 1

      - name: Upload extension artifact
        if: matrix.target == 'macos_m1'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: CodeMySpec/
          include-hidden-files: true
          retention-days: 1

  publish-extension:
    name: Publish Extension & Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binary release assets
        run: |
          mkdir -p release-assets
          echo "Artifact structure:"
          find artifacts -type f | head -20
          for dir in artifacts/cms-*; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            file=$(find "$dir" -type f | head -1)
            if [ -n "$file" ]; then
              cp "$file" "release-assets/$binary"
              chmod +x "release-assets/$binary"
            fi
          done
          ls -la release-assets/

      - name: Fix extension script permissions
        run: chmod +x artifacts/extension/.claude-plugin/bin/* artifacts/extension/install.sh

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Push files + tag to extension repo
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          cd artifacts/extension
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${EXTENSION_REPO}.git"
          git add .
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag -f "${{ steps.version.outputs.tag }}"
          git push -f origin main
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Delete existing release on extension repo (if any)
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" \
            --yes --repo "${EXTENSION_REPO}" 2>/dev/null || true

      - name: Create GitHub Release on extension repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.EXTENSION_REPO }}
          token: ${{ secrets.EXTENSION_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            ### Plugin Marketplace (recommended)
            ```bash
            /plugin marketplace add Code-My-Spec/code_my_spec_claude_code_extension
            /plugin install codemyspec@codemyspec
            ```

            ### Manual Install
            ```bash
            git clone https://github.com/Code-My-Spec/code_my_spec_claude_code_extension.git
            cd code_my_spec_claude_code_extension
            bash install.sh
            claude plugin install ./
            ```
