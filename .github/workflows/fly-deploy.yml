# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      # Full history and tags: the version is git's (nearest vX.Y.Z tag), and the
      # image has no .git to read it from, so it is computed here and passed in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -c fly.prod.toml --build-arg CMS_VERSION="$(scripts/version.sh)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
