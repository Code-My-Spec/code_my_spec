name: Desktop installers

# The desktop build (bb8bc042): the server and harness in one release, in a
# native window (elixir-desktop on desktop_webview), packaged by
# desktop_deployment. Builds the unsigned macOS .dmg and Windows NSIS .exe as
# artifacts, and smoke-installs the Windows one; nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MIX_ENV: desktop
  OTP_VERSION: "28.1"
  ELIXIR_VERSION: "1.19.4"
  # Must match desktop_webview's ref in mix.exs.
  WEBVIEW_REF: 626b270cdcc133fb05f84c12ee98f1cfae009a8a

jobs:
  macos:
    name: macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A stock OTP links dylibs the installer cannot relocate into the .app;
      # scripts/desktop_otp_macos.sh says why. Cached on the recipe itself.
      - name: Restore packaging OTP
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: ~/desktop-otp
          key: desktop-otp-${{ runner.os }}-${{ runner.arch }}-${{ env.OTP_VERSION }}-${{ hashFiles('scripts/desktop_otp_macos.sh') }}

      - name: Build packaging OTP
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          scripts/desktop_otp_macos.sh "$HOME/desktop-otp/$OTP_VERSION" "$OTP_VERSION"
          rm -rf "$HOME/desktop-otp/kerl"

      - name: Install Elixir on that OTP
        run: |
          curl -fsSL -o elixir.zip \
            "https://github.com/elixir-lang/elixir/releases/download/v${ELIXIR_VERSION}/elixir-otp-28.zip"
          mkdir -p "$HOME/elixir" && unzip -q elixir.zip -d "$HOME/elixir"
          echo "$HOME/desktop-otp/$OTP_VERSION/bin" >> "$GITHUB_PATH"
          echo "$HOME/elixir/bin" >> "$GITHUB_PATH"

      - name: Restore webview host
        id: host-cache
        uses: actions/cache@v4
        with:
          path: ~/webview-host
          key: webview-host-${{ runner.arch }}-${{ env.WEBVIEW_REF }}

      - name: Build webview host
        if: steps.host-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/elixir-desktop/webview.git webview-src
          git -C webview-src checkout "$WEBVIEW_REF"
          webview-src/scripts/build_macos.sh
          mkdir -p "$HOME/webview-host"
          cp webview-src/priv/native/macos/DesktopWebView "$HOME/webview-host/"

      - name: Restore deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: desktop-mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: desktop-mix-${{ runner.os }}-${{ env.OTP_VERSION }}-

      - name: Build the .dmg
        env:
          # Baked into config/desktop.exs at build time (CodeMySpecDesktop.OAuthClients).
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          export DESKTOP_HOST_BINARY="$HOME/webview-host/DesktopWebView"
          erl -noshell -eval 'io:format("OTP ~s at ~s~n", [erlang:system_info(otp_release), code:root_dir()]), halt().'
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
          mix assets.deploy
          mix release code_my_spec --overwrite
          ls -la _build/desktop/*.dmg

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: codemyspec-desktop-macos
          path: _build/desktop/*.dmg
          retention-days: 7

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # setup-beam can't map windows-latest's ImageOS (see release-extension.yml).
      - name: Pin ImageOS for setup-beam
        run: echo "ImageOS=win25" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # desktop_deployment's Windows packager: ImageMagick for the .ico, NSIS
      # for the installer, wget for the WebView2 bootstrapper and vcredist.
      - name: Packaging tools
        shell: pwsh
        run: |
          choco install -y --no-progress imagemagick nsis wget
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          Get-ChildItem "C:\Program Files\ImageMagick*" -Directory |
            Select-Object -First 1 -ExpandProperty FullName |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore webview host
        id: host-cache
        uses: actions/cache@v4
        with:
          path: ~/webview-host
          key: webview-host-windows-${{ env.WEBVIEW_REF }}

      - name: Build webview host
        if: steps.host-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/elixir-desktop/webview.git webview-src
          git -C webview-src checkout $env:WEBVIEW_REF
          ./webview-src/scripts/build_windows.ps1
          New-Item -ItemType Directory -Force -Path "$HOME/webview-host" | Out-Null
          Copy-Item webview-src/priv/native/windows/DesktopWebView.exe "$HOME/webview-host/"

      - name: Restore deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: desktop-mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: desktop-mix-${{ runner.os }}-${{ env.OTP_VERSION }}-

      # ortex's ort-sys downloads ONNX Runtime from parcel.pyke.io, which 404s
      # for x86_64-pc-windows-msvc (darwin is still served). Microsoft's own
      # release has onnxruntime.lib (an import library) in lib/: ort-sys links
      # it when ORT_LIB_LOCATION points there, and the NIF then needs
      # onnxruntime.dll beside it (OTP loads NIFs with an altered search path).
      - name: ONNX Runtime
        run: |
          curl -fsSL -o ort.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip"
          unzip -q ort.zip -d "$HOME"
          echo "ORT_LIB_LOCATION=$HOME/onnxruntime-win-x64-${ORT_VERSION}/lib" >> "$GITHUB_ENV"
        env:
          ORT_VERSION: "1.19.2"

      - name: Build the installer
        env:
          # Baked into config/desktop.exs at build time (CodeMySpecDesktop.OAuthClients).
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          export DESKTOP_HOST_BINARY="$HOME/webview-host/DesktopWebView.exe"
          mix deps.get
          mix compile
          native=$(dirname "$(ls _build/desktop/lib/ortex/priv/native/*.dll | head -1)")
          cp "$ORT_LIB_LOCATION/onnxruntime.dll" "$native/"
          ls -la "$native"
          mix assets.deploy
          mix release code_my_spec --overwrite
          ls -la _build/desktop/*.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: codemyspec-desktop-windows
          path: _build/desktop/*.exe
          retention-days: 7

      # The smoke: a real Postgres with pgvector (FirstBoot refuses without
      # it), a silent install, and a launch on 4000/4004 until both answer.
      - name: Postgres with pgvector
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git
          cd pgvector
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1
          sc config "postgresql-x64-17" start= demand
          net start "postgresql-x64-17"


      - name: Silent install
        shell: pwsh
        run: |
          $installer = Get-ChildItem _build/desktop/*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\CodeMySpec"
          Start-Process $installer.FullName -ArgumentList "/S", "/D=$dir" -Wait
          Get-ChildItem $dir | Select-Object Name
          "DESKTOP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The release on its own, with no window (CMS_BROWSER), its output kept:
      # the server, Postgres + pgvector and the harness, apart from the host.
      - name: Boot the release
        shell: pwsh
        env:
          DATABASE_URL: ecto://postgres:root@localhost/cms_desktop_ci
          CMS_BROWSER: "1"
        run: |
          $bat = Join-Path $env:DESKTOP_DIR "beam\bin\code_my_spec.bat"
          $proc = Start-Process $bat -ArgumentList "start" -WorkingDirectory "$env:DESKTOP_DIR\beam" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\release.out" -RedirectStandardError "$env:RUNNER_TEMP\release.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://localhost:4000/app).StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          Write-Output "app 200: $ok (release exited: $($proc.HasExited))"
          try { Write-Output "health: $((Invoke-WebRequest -UseBasicParsing http://localhost:4004/health).Content)" } catch { Write-Output "health: none" }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:DESKTOP_DIR*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $ok) { exit 1 }

      - name: Launch the installed app
        shell: pwsh
        env:
          DATABASE_URL: ecto://postgres:root@localhost/cms_desktop_ci
        run: |
          $app = Join-Path $env:DESKTOP_DIR "CodeMySpec.exe"
          $proc = Start-Process $app -WorkingDirectory $env:DESKTOP_DIR -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\app.out" -RedirectStandardError "$env:RUNNER_TEMP\app.err"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://localhost:4000/app).StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          Write-Output "app 200: $ok (host exited: $($proc.HasExited))"
          try { Write-Output "health: $((Invoke-WebRequest -UseBasicParsing http://localhost:4004/health).Content)" } catch { Write-Output "health: none" }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:DESKTOP_DIR*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $ok) { exit 1 }

      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in "release.out", "release.err", "app.out", "app.err") {
            $p = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $p) { Write-Output "==== $f"; Get-Content $p -Tail 80 }
          }
          Get-ChildItem "$env:USERPROFILE\.codemyspec" -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output "==== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem $env:DESKTOP_DIR -Recurse -Filter erl_crash.dump -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output "==== $($_.FullName)"; Get-Content $_.FullName -TotalCount 40 }
